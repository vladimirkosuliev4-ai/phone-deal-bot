name: Phone deal monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a Telegram setup-test message before monitoring'
        type: boolean
        default: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check for phone deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
        run: python main.py

      - name: Save seen-listing state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update seen listings"
          file_pattern: "seen_listings.json"
