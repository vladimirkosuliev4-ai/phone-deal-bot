name: Phone deal monitor

on:
  schedule:
    # GitHub's shortest supported schedule is every five minutes. Scheduled
    # runs can still be delayed when GitHub Actions is busy.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram setup-test message before monitoring"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: phone-deal-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Check marketplaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run automated tests on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v

      - name: Check for phone deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          args=(--config config.json --state seen_listings.json)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SEND_TEST" == "true" ]]; then
            args+=(--send-test)
          fi
          python main.py "${args[@]}"

      - name: Save seen-listing state
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- seen_listings.json)" ]]; then
            echo "seen_listings.json did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seen_listings.json
          git commit -m "chore: update phone deal state [skip ci]"

          branch="${GITHUB_REF_NAME}"
          if git push origin "HEAD:${branch}"; then
            exit 0
          fi

          echo "The branch changed during this run; rebasing once and retrying."
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          git push origin "HEAD:${branch}"
